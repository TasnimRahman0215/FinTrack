# Dependabot keeps dependencies and the pinned base-image digests current. It opens pull
# requests weekly (and immediately for security advisories); review and merge them like any
# other change. Docs: https://docs.github.com/code-security/dependabot
version: 2
updates:
  # Base images in the Dockerfiles (pinned as tag@sha256:digest).
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  # Backend Python dependencies (backend/uv.lock).
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Frontend npm dependencies (frontend/package-lock.json).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
